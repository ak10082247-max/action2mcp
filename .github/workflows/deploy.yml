name: Deploy Action2MCP, SiteRescue, StoreFix & Revenue Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_all_workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Worker & Sniper Unit Tests
        run: |
          node --test test_worker.mjs
          python scripts/test_sniper.py
          python scripts/test_all_snipers.py
          python -m unittest discover -s scripts -p "test_brand_watch*.py" -v

      - name: Provision Shared FUNNEL_KV Binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/provision_kv_toml.mjs

      - name: Deploy Action2MCP Primary Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy SiteRescue, StoreFix, BrandWatch & Revenue Dashboard Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          for cfg in site_rescue/wrangler.toml ecom_fix/wrangler.toml brand_watch/wrangler.toml revenue_dashboard/wrangler.toml; do
            ok=0
            for attempt in 1 2 3; do
              if npx --yes wrangler@4 deploy --config "$cfg"; then
                ok=1
                break
              fi
              echo "Retrying deploy for $cfg (attempt $attempt)..."
              sleep 4
            done
            if [ "$ok" -ne 1 ]; then
              exit 1
            fi
          done

      - name: Sync Runtime Secrets Across All Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          KUROX_SIGNING_SECRET: ${{ secrets.KUROX_SIGNING_SECRET }}
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          ENSEMBLEDATA_TOKEN: ${{ secrets.ENSEMBLEDATA_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          B2B_WEBHOOK_URL: ${{ secrets.B2B_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          MONTHLY_FIXED_COST_USD: ${{ secrets.MONTHLY_FIXED_COST_USD }}
        run: |
          for cfg in wrangler.toml site_rescue/wrangler.toml ecom_fix/wrangler.toml brand_watch/wrangler.toml revenue_dashboard/wrangler.toml; do
            if [ -n "${STRIPE_SECRET_KEY:-}" ]; then
              printf '%s' "$STRIPE_SECRET_KEY" | npx --yes wrangler@4 secret put STRIPE_SECRET_KEY --config "$cfg" >/dev/null
            fi
            if [ -n "${KUROX_SIGNING_SECRET:-}" ]; then
              printf '%s' "$KUROX_SIGNING_SECRET" | npx --yes wrangler@4 secret put KUROX_SIGNING_SECRET --config "$cfg" >/dev/null
            fi
          done
          for cfg in wrangler.toml site_rescue/wrangler.toml ecom_fix/wrangler.toml brand_watch/wrangler.toml; do
            if [ -n "${CDP_API_KEY_ID:-}" ]; then
              printf '%s' "$CDP_API_KEY_ID" | npx --yes wrangler@4 secret put CDP_API_KEY_ID --config "$cfg" >/dev/null
            fi
            if [ -n "${CDP_API_KEY_SECRET:-}" ]; then
              printf '%s' "$CDP_API_KEY_SECRET" | npx --yes wrangler@4 secret put CDP_API_KEY_SECRET --config "$cfg" >/dev/null
            fi
          done
          if [ -n "${APIFY_TOKEN:-}" ]; then
            printf '%s' "$APIFY_TOKEN" | npx --yes wrangler@4 secret put APIFY_TOKEN --config revenue_dashboard/wrangler.toml >/dev/null
            printf '%s' "$APIFY_TOKEN" | npx --yes wrangler@4 secret put APIFY_TOKEN --config brand_watch/wrangler.toml >/dev/null
          fi
          if [ -n "${SCRAPECREATORS_API_KEY:-}" ]; then
            printf '%s' "$SCRAPECREATORS_API_KEY" | npx --yes wrangler@4 secret put SCRAPECREATORS_API_KEY --config brand_watch/wrangler.toml >/dev/null
          fi
          if [ -n "${ENSEMBLEDATA_TOKEN:-}" ]; then
            printf '%s' "$ENSEMBLEDATA_TOKEN" | npx --yes wrangler@4 secret put ENSEMBLEDATA_TOKEN --config brand_watch/wrangler.toml >/dev/null
          fi
          if [ -n "${RESEND_API_KEY:-}" ]; then
            printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY --config brand_watch/wrangler.toml >/dev/null
          fi
          if [ -n "${RESEND_FROM_EMAIL:-}" ]; then
            printf '%s' "$RESEND_FROM_EMAIL" | npx --yes wrangler@4 secret put RESEND_FROM_EMAIL --config brand_watch/wrangler.toml >/dev/null
          fi
          if [ -n "${B2B_WEBHOOK_URL:-}" ]; then
            printf '%s' "$B2B_WEBHOOK_URL" | npx --yes wrangler@4 secret put B2B_WEBHOOK_URL --config brand_watch/wrangler.toml >/dev/null
          fi
          if [ -n "${GH_PAT:-}" ]; then
            printf '%s' "$GH_PAT" | npx --yes wrangler@4 secret put GH_PAT --config brand_watch/wrangler.toml >/dev/null
          fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            printf '%s' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4 secret put CF_ANALYTICS_TOKEN --config revenue_dashboard/wrangler.toml >/dev/null
          fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4 secret put CF_ACCOUNT_ID --config revenue_dashboard/wrangler.toml >/dev/null
          fi
          if [ -n "${DASHBOARD_PASSWORD:-}" ]; then
            printf '%s' "$DASHBOARD_PASSWORD" | npx --yes wrangler@4 secret put DASHBOARD_PASSWORD --config revenue_dashboard/wrangler.toml >/dev/null
          fi
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "$STRIPE_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put STRIPE_WEBHOOK_SECRET --config revenue_dashboard/wrangler.toml >/dev/null
          fi
          if [ -n "${DASHBOARD_INGEST_TOKEN:-}" ]; then
            printf '%s' "$DASHBOARD_INGEST_TOKEN" | npx --yes wrangler@4 secret put DASHBOARD_INGEST_TOKEN --config revenue_dashboard/wrangler.toml >/dev/null
            printf '%s' "$DASHBOARD_INGEST_TOKEN" | npx --yes wrangler@4 secret put DASHBOARD_INGEST_TOKEN --config brand_watch/wrangler.toml >/dev/null
          fi
          if [ -n "${MONTHLY_FIXED_COST_USD:-}" ]; then
            printf '%s' "$MONTHLY_FIXED_COST_USD" | npx --yes wrangler@4 secret put MONTHLY_FIXED_COST_USD --config revenue_dashboard/wrangler.toml >/dev/null
          fi
