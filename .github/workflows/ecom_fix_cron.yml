name: Play B - StoreFix E-Com Revenue-Leak Sniper

permissions:
  contents: write

on:
  schedule:
    - cron: '44 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  ecom_fix_sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run StoreFix Sniper Tests & Outreach
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ECOM_FIX_BASE_URL: https://ecom-fix.ak10082247.workers.dev
        run: |
          python scripts/test_all_snipers.py
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python scripts/ecom_fix_sniper.py --limit 35 --max-emails 15 --send
          else
            echo "SMTP secrets not set; skipping --send."
          fi

      - name: Persist Play B State
        run: |
          if [ -f data/ecom_fix_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/ecom_fix_state.json
            git diff --staged --quiet || (git commit -m "chore: persist Play B ecom fix outreach state [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
          fi
