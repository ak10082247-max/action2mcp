name: Play B - StoreFix E-Com Revenue-Leak Sniper

permissions:
  contents: write

on:
  schedule:
    - cron: '44 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      canary_to:
        description: 'Comma-separated canary Gmail/Outlook inboxes (sends canary only, uncounted)'
        required: false
        default: ''

jobs:
  ecom_fix_sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run StoreFix Sniper Tests & Outreach
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          INPUT_CANARY_TO: ${{ inputs.canary_to }}
          ECOM_FIX_BASE_URL: https://ecom-fix.ak10082247.workers.dev
        run: |
          python scripts/test_all_snipers.py
          if [ -n "$INPUT_CANARY_TO" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python scripts/ecom_fix_sniper.py --canary-to "$INPUT_CANARY_TO"
          elif [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python scripts/ecom_fix_sniper.py --limit 100 --max-emails 20 --hard-stop 200 --send
          else
            echo "SMTP secrets not set; skipping --send."
          fi

      - name: Persist Play B State
        run: |
          if [ -f data/ecom_fix_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/ecom_fix_state.json
            git diff --staged --quiet || (git commit -m "chore: persist Play B ecom fix outreach state [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
          fi
