name: Play C - B2B Agency White-Label Overflow Sniper

permissions:
  contents: write

on:
  schedule:
    - cron: '19 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      canary_to:
        description: 'Comma-separated canary Gmail/Outlook inboxes (sends canary only, uncounted)'
        required: false
        default: ''

jobs:
  agency_overflow_sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Play C Agency Overflow Tests & Outreach
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          DASHBOARD_URL: https://kurox-revenue-dashboard.ak10082247.workers.dev
          INPUT_CANARY_TO: ${{ inputs.canary_to }}
          SITE_RESCUE_BASE_URL: https://site-rescue.ak10082247.workers.dev
          ECOM_FIX_BASE_URL: https://ecom-fix.ak10082247.workers.dev
        run: |
          python scripts/test_all_snipers.py
          if [ -n "$INPUT_CANARY_TO" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python scripts/agency_overflow_sniper.py --canary-to "$INPUT_CANARY_TO"
          elif [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python scripts/agency_overflow_sniper.py --queries 16 --limit 200 --max-emails 20 --hard-stop 200 --send
          else
            echo "SMTP secrets not set; skipping --send."
          fi

      - name: Persist Play C State
        run: |
          if [ -f data/agency_overflow_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/agency_overflow_state.json
            git diff --staged --quiet || (git commit -m "chore: persist Play C agency overflow outreach state [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
          fi
