name: Play A - SiteRescue Local Business Sniper

permissions:
  contents: write

on:
  schedule:
    - cron: '11 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      canary_to:
        description: 'Comma-separated canary Gmail/Outlook inboxes (sends canary only, uncounted)'
        required: false
        default: ''

jobs:
  site_rescue_sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SiteRescue Sniper Tests & Outreach
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          DASHBOARD_URL: https://kurox-revenue-dashboard.ak10082247.workers.dev
          INPUT_CANARY_TO: ${{ inputs.canary_to }}
          SITE_RESCUE_BASE_URL: https://site-rescue.ak10082247.workers.dev
        run: |
          python scripts/test_all_snipers.py
          if [ -n "$INPUT_CANARY_TO" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python scripts/site_rescue_sniper.py --canary-to "$INPUT_CANARY_TO"
          elif [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python scripts/site_rescue_sniper.py --queries 8 --limit 100 --max-emails 20 --hard-stop 200 --send
          else
            echo "SMTP secrets not set; skipping --send."
          fi

      - name: Persist Play A State
        run: |
          if [ -f data/site_rescue_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/site_rescue_state.json
            git diff --staged --quiet || (git commit -m "chore: persist Play A site rescue outreach state [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
          fi
