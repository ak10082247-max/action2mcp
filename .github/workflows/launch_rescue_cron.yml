name: Play D - LaunchRescue Indie Bug & Security Sniper

permissions:
  contents: write

on:
  schedule:
    - cron: '31 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  launch_rescue_sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run LaunchRescue Sniper Tests & Outreach
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          DASHBOARD_URL: https://kurox-revenue-dashboard.ak10082247.workers.dev
          SITE_RESCUE_BASE_URL: https://site-rescue.ak10082247.workers.dev
        run: |
          python scripts/test_all_snipers.py
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python scripts/launch_rescue_sniper.py --limit 140 --max-emails 20 --hard-stop 200 --send
          else
            echo "SMTP secrets not set; skipping --send."
          fi

      - name: Persist Play D State
        run: |
          if [ -f data/launch_rescue_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/launch_rescue_state.json
            git diff --staged --quiet || (git commit -m "chore: persist Play D launch rescue outreach state [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
          fi
