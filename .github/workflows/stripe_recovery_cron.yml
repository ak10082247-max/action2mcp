name: Stripe Webhook Alerts, Recovery & IMAP Bounce Sync

permissions:
  contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  stripe_alerts_and_bounce_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Stripe Sale/Recovery Alerts & Sync IMAP Bounces
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          DASHBOARD_URL: https://kurox-revenue-dashboard.ak10082247.workers.dev
        run: |
          python scripts/test_sniper.py
          python scripts/test_all_snipers.py
          python scripts/process_stripe_alerts.py

      - name: Persist IMAP Bounce / Pause State Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || (git commit -m "chore: sync IMAP bounce rates and pause gates [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
