name: CautionWatch Strict Unverified-Content TikTok Poller

permissions:
  contents: write

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run live scraper poll & subscriber alerts (true/false)'
        required: false
        default: 'true'
      provider:
        description: 'Scraper provider (auto, ensembledata, rapidapi, apify)'
        required: false
        default: 'auto'
      apify_actor:
        description: 'Apify actor ID(s) if provider uses Apify'
        required: false
        default: 'novi~tiktok-scraper-ultimate'
      max_items:
        description: 'Hard cap on raw items scanned per run'
        required: false
        default: '250'
      extra_profile:
        description: 'Optional extra TikTok @username profile to poll'
        required: false
        default: ''
      profiles_only:
        description: 'If true, scrape full suspect profiles only without query dilution'
        required: false
        default: 'false'
      search_only:
        description: 'If true, scrape keyword/hashtag search queries only'
        required: false
        default: 'false'
      extra_args:
        description: 'Optional extra CLI flags for poll_tiktok_caution.py'
        required: false
        default: ''

jobs:
  poll_caution_videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CautionWatch Poller Unit Tests
        run: python -m unittest discover -s scripts -p "test_brand_watch*.py" -v

      - name: Poll Caution-Unverified TikTok Videos & Dispatch Alerts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ENSEMBLEDATA_TOKEN: ${{ secrets.ENSEMBLEDATA_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          KUROX_SIGNING_SECRET: ${{ secrets.KUROX_SIGNING_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          BRAND_WATCH_URL: https://brand-watch.ak10082247.workers.dev
          INPUT_RUN_LIVE: ${{ inputs.run_live || 'true' }}
          INPUT_PROVIDER: ${{ inputs.provider || 'auto' }}
          INPUT_APIFY_ACTOR: ${{ inputs.apify_actor || 'novi~tiktok-scraper-ultimate' }}
          INPUT_MAX_ITEMS: ${{ inputs.max_items || '250' }}
          INPUT_EXTRA_PROFILE: ${{ inputs.extra_profile || '' }}
          INPUT_PROFILES_ONLY: ${{ inputs.profiles_only || 'false' }}
          INPUT_SEARCH_ONLY: ${{ inputs.search_only || 'false' }}
          INPUT_EXTRA_ARGS: ${{ inputs.extra_args || '' }}
        run: |
          if [ "$INPUT_RUN_LIVE" = "true" ] && { [ -n "$ENSEMBLEDATA_TOKEN" ] || [ -n "$RAPIDAPI_KEY" ] || [ -n "$APIFY_TOKEN" ]; }; then
            EXTRA_ARG=""
            if [ -n "$INPUT_EXTRA_PROFILE" ]; then
              EXTRA_ARG="--profile $INPUT_EXTRA_PROFILE"
            fi
            if [ "$INPUT_PROFILES_ONLY" = "true" ]; then
              EXTRA_ARG="$EXTRA_ARG --profiles-only"
            fi
            if [ "$INPUT_SEARCH_ONLY" = "true" ]; then
              EXTRA_ARG="$EXTRA_ARG --search-only"
            fi
            python scripts/poll_tiktok_caution.py --live --provider "$INPUT_PROVIDER" --apify-actor "$INPUT_APIFY_ACTOR" --max-items "$INPUT_MAX_ITEMS" $EXTRA_ARG $INPUT_EXTRA_ARGS
          else
            echo "Dry run (no live scraper token enabled or run_live=false)."
            python scripts/poll_tiktok_caution.py
          fi

      - name: Persist Flagged Caution Archive & Alert State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f brand_watch/flagged_videos.json brand_watch/seed_caution.js
          if [ -f data/caution_alert_state.json ]; then
            git add data/caution_alert_state.json
          fi
          git diff --staged --quiet || (git commit -m "chore: update CautionWatch unverified video feed [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
