name: Play E - Playwright Broken Money-Button Sniper

permissions:
  contents: write

on:
  schedule:
    - cron: '19 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      max_probe:
        description: 'Max sites to probe in headless Chromium'
        required: false
        default: '120'

jobs:
  money_button_sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Run Play E Unit Tests & Live Chromium Sniper
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          DASHBOARD_URL: https://kurox-revenue-dashboard.ak10082247.workers.dev
          MAX_PROBE: ${{ inputs.max_probe || '120' }}
        run: |
          python scripts/test_money_button.py -v
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            python -u scripts/money_button_sniper.py --local-queries 14 --ecom-limit 14 --max-probe "$MAX_PROBE" --concurrency 5 --max-emails 15 --send
          else
            python -u scripts/money_button_sniper.py --local-queries 14 --ecom-limit 14 --max-probe 40 --concurrency 4
          fi

      - name: Persist Play E State & Runtime Hits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/money_button_state.json data/money_button_hits.jsonl 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: persist Play E money-button outreach state [skip ci]" && git pull --rebase --autostash origin main && git push origin main)
